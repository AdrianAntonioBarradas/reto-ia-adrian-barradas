  - id: localstack-lab
    name: Laboratorio AWS Local (LocalStack)
    attribution: own
    proficiency: PROJECT
    domains: [cloud, devops]
    solution: >-
      Entorno local para desarrollar y probar servicios serverless sin depender de
      infraestructura en la nube. Construido sobre dos laptops conectadas por Ethernet:
      un Ubuntu LTS como cliente y un Ubuntu Server como host. Docker Compose para orquestar
      LocalStack. Pipeline completo Lambda + DynamoDB + API Gateway construido end-to-end con
      una app CRUD de notas. Automatización con justfile y awslocal CLI.
    technologies: [LocalStack, Docker Compose, AWS Lambda, DynamoDB, API Gateway, S3, SQS,
                   EventBridge, just, Linux, SSH]
    why_it_matters: >-
      Demuestra entender cómo funcionan los servicios de AWS, no sólo consumirlos.

