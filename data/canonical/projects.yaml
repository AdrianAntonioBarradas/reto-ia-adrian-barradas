# Every project carries an `attribution` field. This is the machine-readable form of
# the "Nota para la IA" lines in master.md, and it is what stops the agent from
# claiming credit for work that is not Adrián's.
#
#   own          -> built by Adrián; safe to describe as his.
#   contribution -> he contributed code to someone else's product; never "his product".
#   not_mine     -> explicitly built by someone else; the agent must say so.
source_id: master.md#projects
updated_at: 2026-09-11

projects:
  - id: newman-eval-framework
    name: Framework de Evaluación de Estrategias de Chatbot — Instituto Newman
    attribution: own
    proficiency: PROJECT
    domains: [ai, data, backend]
    period: "2026-08"
    context: >-
      Track de research de IA conversacional para el Instituto Newman (institución mexicana
      de formación en psicología), en colaboración con Ayari Tech.
    problem: >-
      Elegir una estrategia de ruteo para un chatbot de atención en español sin poder
      justificar la elección con evidencia: las cuatro alternativas obvias no eran
      comparables entre sí.
    solution: >-
      Framework comparativo de cuatro estrategias sobre un mismo modelo de dominio, pipeline
      de contenido y arnés de evaluación: (1) reglas por keywords como línea base de
      contraste, (2) router semántico con embeddings locales sentence-transformers y umbrales
      de confianza y margen, (3) clasificador TF-IDF + regresión logística con extracción de
      entidades por reglas, y (4) RAG de recuperación con VectorStore coseno propio en numpy
      y doble compuerta de grounding que exige que cada segmento de la respuesta sea cita
      textual de una fuente citada. Compuerta de política previa al ruteo: consultas legales,
      médicas de emergencia, de acoso o de angustia emocional escalan siempre a humano sin
      citar FAQ.
    impact: >-
      Taxonomía de 18 intents, corpus de 47 entradas FAQ y 417 variantes de paráfrasis en
      español mexicano generadas bajo restricciones ejecutables para evitar entrenar sobre el
      conjunto de prueba. Inferencia totalmente offline y determinista. 519 tests, Python 3.12
      con mypy strict y ruff.
    technologies:
      [Python 3.12, sentence-transformers, scikit-learn, numpy, Pydantic, pytest, mypy, ruff,
       devbox, pipenv, just]

  - id: llm-eval-harness
    name: Arnés de Evaluación y Medición de Sistemas LLM/Retrieval
    attribution: own
    proficiency: PROJECT
    domains: [ai, data, statistics]
    period: "2026-08"
    problem: >-
      Sin medición, "el chatbot mejoró" es una opinión. Y peor: una métrica sola puede mentir.
    solution: >-
      Arnés compartido con casos golden derivados del catálogo de intents, sets de paráfrasis,
      escenarios multi-turno y probes fuera de dominio que *deben* escalar a humano. Métricas
      de exactitud, latencia media y p95, recall@k, MRR, rank medio y pico de RSS, con
      umbrales de aceptación ejecutables y un resolvedor de presupuesto de memoria por modelo.
    impact: >-
      El barrido comparativo de cinco encoders detectó un confundido entre recall y rechazo:
      los modelos con mejor recall escalaban 0 de 5 probes fuera de dominio. No recuperaban
      mejor — fallaban en negarse. Eso obligó a recalibrar el umbral por modelo en vez de
      adoptar el encoder aparentemente superior. Aparte, detectó y corrigió una
      no-determinación entre procesos (orden de iteración de frozenset combinado con la
      aleatorización del hash de strings) que hacía que tres invocaciones idénticas produjeran
      tres resultados distintos, incluido un cambio de escalar a no escalar; retiró la
      conclusión previamente publicada que esa medición invalidaba.
    technologies: [Python, numpy, scikit-learn, pytest]
    why_it_matters: >-
      Reportar un resultado negativo y retractar una conclusión propia es la evidencia más
      directa de criterio técnico. Responde a "¿cómo verificas que el sistema es confiable?"
      con un caso real en vez de una promesa.

