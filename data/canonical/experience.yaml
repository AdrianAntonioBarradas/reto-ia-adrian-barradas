experience:
  - id: cicada
    organization: Cicada
    sector: Fintech — plataforma de trading
    role_es: Ingeniero de Software
    role_en: Software Engineer
    start_date: "2024-01"
    end_date: "2026-05"
    domain: >-
      Sistemas de post-trade y liquidación para operaciones institucionales de bonos.
    technologies:
      [Python, Go, SQL, PostgreSQL, FastAPI, Django, NATS, Typst, Twilio SendGrid,
       REST, Docker, Git, GitHub Actions, AWS S3, MinIO, Linux, Vault, Argo, React,
       Redux, shadcn/ui]
    technical_notes:
      # Registrado a propósito: sabe que la solución que dejó no es la óptima y sabe
      # cuál sería. Eso es criterio técnico, no una debilidad que esconder.
      - >-
        En el pipeline de documentos, los PDF viajan en base64 dentro del evento de NATS.
        Es consciente de que no es lo óptimo: la alternativa que tenía identificada era
        subirlos a S3 y pasar la referencia, que es como lo resolvía el monolito.
    highlights:
      - id: posttrade_ownership
        proficiency: PROVEN
        domains: [backend, finance]
        es: >-
          Responsable del microservicio de Post-Trade, automatizando instrucciones de
          liquidación para operaciones institucionales de bonos con múltiples tipos de
          contraparte. No fue una extracción mecánica del monolito: la forma en que el
          monolito resolvía el problema no cubría los requerimientos del negocio, así que
          hubo que rediseñar y replantear el dominio, y deprecar deliberadamente parte de
          lo que existía.
      - id: document_generation_pipeline
        proficiency: PROVEN
        domains: [backend, automation, finance]
        es: >-
          Construí dentro del microservicio de Post-Trade la generación de cartas de
          confirmación —reportes en PDF que se envían por correo a clientes sobre sus
          operaciones—, sustituyendo una versión previa que vivía en una hoja de cálculo
          con Google Apps Script. Escribí las plantillas de los documentos en Typst, y el
          servicio los genera y los publica por un evento de NATS hacia otro microservicio
          que unifica la información y la entrega a Twilio SendGrid para el envío.
      - id: email_templates_cross_client
        proficiency: PROVEN
        domains: [backend, frontend]
        es: >-
          Edité las plantillas de correo del servicio de envío para que se vieran de forma
          fidedigna tanto en Gmail como en Outlook, que requieren HTML y estilos
          distintos para renderizar igual.
        caveat: >-
          Es trabajo real de plantillas HTML de correo, no de frontend de aplicación. No
          presentarlo como experiencia de desarrollo frontend.
      - id: compliance_screening
        proficiency: PROVEN
        domains: [data, backend, finance]
        es: >-
          Diseñé un motor de validación de cumplimiento para screening de listas de
          sanciones OFAC, integrando múltiples algoritmos de coincidencia para asegurar
          precisión de datos y reducir falsos positivos.
      - id: report_aggregation
        proficiency: PROVEN
        domains: [data, backend, ops]
        es: >-
          Desarrollé un servicio centralizado de agregación de reportes que consumía datos
          de múltiples microservicios, consolidando información entre dominios en reportes
          estructurados bajo demanda.
      - id: incremental_reporting
        proficiency: PROVEN
        domains: [data, ops, automation]
        es: >-
          Implementé un sistema de reportes operativos incrementales que agregaba datos
          transaccionales diarios y automatizaba fusiones mediante cron jobs, reduciendo
          trabajo manual recurrente.
      - id: settlement_automation
        proficiency: PROVEN
        domains: [ops, automation, backend]
        es: >-
          Automaticé procesos operativos de liquidación con un sistema de booking basado en
          cron para procesamiento en lote, reduciendo la carga operativa manual.
      - id: observability
        proficiency: PROVEN
        domains: [data, ops]
        es: >-
          Construí observabilidad del estado de liquidación mediante logging estructurado y
          métricas a nivel unitario, facilitando el diagnóstico de incidentes por el equipo.
      - id: data_modeling
        proficiency: PROVEN
        domains: [data, backend]
        es: >-
          Diseñé modelos de datos y esquemas SQL/PostgreSQL para flujos de liquidación, con
          validaciones de límites de líneas, restricciones de efectivo e instituciones
          intermediarias.
      - id: advanced_search
        proficiency: PROVEN
        domains: [backend, data]
        es: >-
          Implementé una API flexible para filtrado avanzado y búsqueda compleja sobre listas
          de gran volumen, soportando consultas multi-tabla dinámicas optimizadas vía ORM.
      - id: microservice_migration
        proficiency: PROVEN
        domains: [backend]
        es: >-
          Migré gradualmente funcionalidades de un monolito preexistente en Django a
          arquitectura de microservicios, siguiendo principios hexagonales y orientados
          a eventos. Eso implicó aprender Django y su ORM sobre una base de código
          grande que ya existía, para poder leerla, modificarla y extraer piezas de ella
          sin romperla.
      - id: nats_price_feed
        proficiency: PROVEN
        domains: [backend, data, finance]
        es: >-
          Extraje del monolito el segmento que recibía eventos externos de precios por
          NATS —publicados desde un Excel— y lo migré a un microservicio nuevo que
          unificaba esos datos externos con los propios del servicio, construyendo un
          histórico de precios y sus características.
      - id: s3_storage
        proficiency: PROVEN
        domains: [cloud, data, ops]
        es: >-
          Almacené y distribuí reportes mediante AWS S3 y MinIO en entorno local, generando
          enlaces de descarga para usuarios finales.
      - id: fullstack_terms
        proficiency: PROVEN
        domains: [frontend, backend]
        es: >-
          Mejoré el módulo de Términos de Uso con una interfaz en React, Redux y shadcn/ui,
          integrando un editor de texto enriquecido, APIs REST, verificación periódica de
          nuevas versiones y un dashboard de BackOffice para monitorear la aceptación de los
          usuarios.
      - id: end_to_end_features
        proficiency: PROVEN
        domains: [backend, frontend]
        es: >-
          Tomé responsabilidad end-to-end de features: desde el levantamiento del
          requerimiento y las decisiones de producto hasta la integración final entre
          frontend y backend.
      - id: abm_simulation
        proficiency: PROJECT
        domains: [ai, data, finance]
        es: >-
          Desarrollé un POC exploratorio de simulación basada en agentes (Mesa/Python) para
          evaluar escenarios operativos de liquidación como apoyo a la toma de decisiones.
        caveat: Fue un POC exploratorio, no un sistema en producción.
      # Two entries below are FAMILIAR, not PROVEN. The distinction is load-bearing:
      # the agent must never present them as operator-level expertise.
      - id: logging_monitoring
        proficiency: FAMILIAR
        domains: [ops, cloud]
        es: >-
          Implementé logging estructurado que alimentaba ecosistemas de monitoreo con Datadog
          y CloudWatch.
        caveat: >-
          Sus compañeros tenían el acceso directo a Datadog y CloudWatch. Él implementó el
          logging que alimentaba esos sistemas. Presentar como familiaridad, nunca como
          operador de esas herramientas.
      - id: vault_argo
        proficiency: FAMILIAR
        domains: [cloud, devops]
        es: >-
          Gestioné secretos con Vault y despliegues con Argo, ajustando configuraciones de
          infraestructura de la aplicación.
        caveat: >-
          Usó infraestructura existente montada por otros; ajustó configuraciones, no
          construyó la infraestructura. Presentar como familiaridad, nunca como platform
          engineer.

