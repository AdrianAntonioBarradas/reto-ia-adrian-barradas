# Every skill carries its proficiency tag. The tags are not decoration: the
# structured `list_skills` tool always returns the tag alongside the skill name,
# so the model is never handed a bare skill it could present as expertise.
#
#   PROVEN      -> professional production experience; core expertise.
#   EXPERIENCED -> solid working knowledge; a skill, not deep expertise.
#   FAMILIAR    -> some exposure. Say "familiaridad con", never "experto en".
#   LEARNING    -> actively studying. NEVER present as professional experience.
#   PROJECT     -> personal or academic project only, not professional work.
source_id: master.md#technical-skills
