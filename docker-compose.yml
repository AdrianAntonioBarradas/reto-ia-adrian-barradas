# Local development only. Production Postgres is provisioned by the hosting platform.
# pgvector image rather than plain postgres: the chunk table needs the `vector` type.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: cvagent
      POSTGRES_PASSWORD: cvagent
      POSTGRES_DB: cvagent
    ports:
      - "5433:5432"   # 5433 to avoid colliding with any host Postgres
    volumes:
      - cvagent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvagent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cvagent_pgdata:
