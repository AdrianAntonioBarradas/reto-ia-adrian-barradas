# Railway config-as-code.
# NOTE: this file must be pointed at from the dashboard (Settings -> Config-as-code).
# There is no RAILWAY_CONFIG_FILE environment variable.
[build]
builder = "NIXPACKS"

[deploy]
# Fail-closed: if the migration fails the new version is never promoted.
preDeployCommand = ["uv run alembic upgrade head"]
startCommand = "uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
