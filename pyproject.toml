[project]
name = "cv-agent"
version = "0.1.0"
description = "Agente de CV conversacional con endpoint compatible con Open Responses"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastembed>=0.8.0",
    "numpy>=2.5.3",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "types-pyyaml>=6.0",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
# The stopword list is a block of prose; a 100-element list literal is worse.
"app/retrieval/lexical.py" = ["SIM905"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^migrations/versions/"]

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Integration tests need a live Postgres; excluded from the default run.
addopts = "-m 'not integration' -q"
markers = [
    "integration: requires a live Postgres (run with -m integration)",
    "llm: spends real LLM tokens (run manually)",
]

# Editor LSP only (Helix -> pyright). Not used by CI, which runs mypy.
[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
